apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/LROOP2022/hack-manifests.git
    targetRevision: main
    path: team-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: team-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
