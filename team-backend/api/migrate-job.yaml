# Миграции БД перед выкаткой. Argo CD запускает Job на каждом sync (hook Sync, волна -1),
# Deployment (волна 0) ждёт его успешного завершения. Образ тот же, что у api:
# kustomize подставит тег из images[0], поэтому схема и код всегда одной версии.
# Упавший Job остаётся для разбора (kubectl -n team-backend logs job/api-migrate),
# перед следующим sync он пересоздаётся (BeforeHookCreation).
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: api-migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        role: apps
      containers:
        - name: migrate
          image: ghcr.io/lroop2022/api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "scripts.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
