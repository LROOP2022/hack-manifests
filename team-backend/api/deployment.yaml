apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  # Recreate: модели грузятся в память целиком, а квота namespace (limits.memory 3Gi)
  # не вместит два пода сразу. С RollingUpdate новый под завис бы в Pending.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        role: apps
      containers:
        - name: api
          image: ghcr.io/lroop2022/api
          imagePullPolicy: IfNotPresent
          # Секретов и базы больше нет: модели и справочники (SQLite) лежат в образе
          # (/models/artifacts, ML_ARTIFACTS_DIR задан в Dockerfile).
          # Необязательные переменные: MODEL_THREADS, MAX_CSV_BYTES, CORS_ORIGINS, VERIFY_ARTIFACTS_ON_START.
          env:
            - name: MODEL_THREADS
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          # Значения стартовые, пик памяти не измерен: после запуска смотрите
          # `kubectl -n team-backend top pod` и OOMKilled, затем поправьте.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
